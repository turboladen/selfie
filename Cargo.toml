[workspace]
members = ["crates/*"]
# A bare `cargo build` selects these. `test-common` is left out because its
# normal dependency is `selfie` with `with_mocks`, and a build that selects it
# links the mocks and test-only helpers into every binary. `xtask` is a tool,
# not part of selfie. Anything that has to cover them, `cargo clippy` and
# `cargo test` included, says `--workspace`. A new binary crate is added here.
default-members = ["crates/cli", "crates/mcp-server", "crates/selfie"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
console = "0.16"
dunce = "1.0"
etcetera = "0.11"
futures = "0.3.31"
indexmap = { version = "2", features = ["serde"] }
gix = { version = "0.86", default-features = false, features = ["sha1", "status", "index", "revision", "tree-editor"] }
indicatif = "0.18"
mockall = "0.15.0"
nix = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1.0"
serde-saphyr = "2.0.0"
sha2 = "0.11"
shellexpand = "3.1"
similar = "3"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
tokio = "1.44"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.16", features = ["serde", "v4"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
