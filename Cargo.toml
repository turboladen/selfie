[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
console = "0.15"
futures = "0.3.31"
mockall = "0.14.0"
serde_yaml = "0.9.34"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3.17.1"
tokio = "1.44"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
