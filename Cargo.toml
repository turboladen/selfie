[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
console = "0.16"
dunce = "1.0"
futures = "0.3.31"
gix = { version = "0.81", default-features = false, features = ["sha1", "status", "index", "revision", "tree-editor"] }
indicatif = "0.18"
mockall = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.22"
sha2 = "0.10"
similar = "2"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.17.1"
tokio = "1.44"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version = "1.23", features = ["serde", "v4"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
