# Deserializing YAML into selfie's own types goes through `selfie::yaml::parse`,
# which suppresses source snippets and answers a classified failure. A parse made
# directly against serde-saphyr quotes the file it was reading into its error, and
# those errors reach the CLI and the MCP server's JSON. Selfie's own config file is
# the exception, and reaches the `config` crate instead.
#
# Every deserializing entry point serde-saphyr exports at its crate root with the
# features selfie enables, not the four spellings someone happens to reach for
# first. A list covering some of them bans a habit rather than the behavior.
#
# The type is denied as well as the functions: without it a new error variant
# could store the raw error and render it later, which no ban on the parse
# entry points would catch.
disallowed-methods = [
  { path = "serde_saphyr::from_str", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_str_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_slice", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_slice_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_multiple", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_multiple_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_slice_multiple", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_slice_multiple_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_reader", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_reader_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::read", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::read_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::with_deserializer_from_str", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::with_deserializer_from_str_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::with_deserializer_from_slice", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::with_deserializer_from_slice_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::with_deserializer_from_reader", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::with_deserializer_from_reader_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
]

disallowed-types = [
  { path = "serde_saphyr::Error", reason = "let selfie::yaml::ParseFailure carry a parse failure; the raw error renders the file's text" },
  { path = "serde_saphyr::Deserializer", reason = "let selfie::yaml::parse drive the deserializer; a hand-driven one keeps the raw error" },
]
