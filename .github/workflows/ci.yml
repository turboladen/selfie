name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: [".beads/**"]
  pull_request:
    paths-ignore: [".beads/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.49.0

  check-dprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dprint/check@v2.3
        with:
          config-path: dprint.jsonc

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Nothing else builds the docs. `cargo test` does not, and neither does
      # `just check`, so a broken intra-doc link used to fail nowhere -- eleven of
      # them reached main that way. `--all-features` so the `with_mocks` items are
      # documented too; without it their links go unchecked.
      #
      # Expect one cargo warning about an output filename collision on
      # `selfie/index.html`: `selfie` is documented both as a workspace member and
      # as test-common's dependency. It is a cargo warning rather than a rustdoc
      # one, so `-D warnings` does not turn it into an error and the job still
      # passes. Do not chase it.
      - name: Rustdoc (zero warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --all-features

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Installed up here rather than beside the step that uses it: a step with no
      # `if:` is skipped once an earlier one fails, which would leave the guarded
      # step below running without the tool.
      - uses: taiki-e/install-action@cargo-hack
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
      # `selfie` is the only crate with optional features, and the run above always
      # builds it with `with_mocks` on because `test-common` requests it. Covering
      # every combination catches a feature that has stopped compiling on its own,
      # which that single combination cannot. Runs last, and runs even when the
      # workspace suite failed, so neither result can hide the other.
      - name: Test each feature combination
        if: ${{ !cancelled() }}
        run: cargo hack --each-feature test -p selfie
