name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: [".beads/**"]
  pull_request:
    paths-ignore: [".beads/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every job but check-typos runs a `just` recipe, so the Justfile is the one
# place a gate's command is written and `just check` runs what CI runs. The
# typos job keeps the crate-ci action because it pins the tool version.
jobs:
  check-typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.50.2

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      # Pinned so CI wraps Markdown the way the local binary does. The markdown
      # plugin is pinned in dprint.jsonc, but an unpinned CLI once rejected a
      # line wrap that local `dprint check` had accepted.
      - uses: taiki-e/install-action@v2
        with:
          tool: dprint@0.57.0
      - name: Check formatting
        run: just fmt-check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - name: Clippy (zero warnings)
        run: just clippy

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - name: Rustdoc (zero warnings)
        run: just docs-check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      # Installed up here rather than beside the step that uses it: a step with no
      # `if:` is skipped once an earlier one fails, which would leave the guarded
      # step below running without the tool.
      - uses: taiki-e/install-action@cargo-hack
      - name: Build
        run: just build
      - name: Run tests
        run: just test
      # Runs last, and runs even when the workspace suite failed, so neither
      # result can hide the other.
      - name: Test each feature combination
        if: ${{ !cancelled() }}
        run: just hack
