name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: [".beads/**"]
  pull_request:
    paths-ignore: [".beads/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0

  check-dprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dprint/check@v2.3
        with:
          config-path: dprint.jsonc

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Installed up here rather than beside the step that uses it: a step with no
      # `if:` is skipped once an earlier one fails, which would leave the guarded
      # step below running without the tool.
      - uses: taiki-e/install-action@cargo-hack
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
      # `selfie` is the only crate with optional features, and the run above always
      # builds it with `with_mocks` on because `test-common` requests it. Covering
      # every combination catches a feature that has stopped compiling on its own,
      # which that single combination cannot. Runs last, and runs even when the
      # workspace suite failed, so neither result can hide the other.
      - name: Test each feature combination
        if: ${{ !cancelled() }}
        run: cargo hack --each-feature test -p selfie
