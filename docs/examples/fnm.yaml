name: fnm
version: 1.0.0
description: Fast Node.js version manager
homepage: https://github.com/Schniz/fnm

environments:
  macos:
    install: brew install fnm
    check: which fnm && fnm --version
    dependencies:
      - homebrew

  ubuntu:
    install: |
      set -e  # Example of best practice error handling
      # Install fnm via official installer
      curl -fsSL https://fnm.vercel.app/install | bash
      # Add to shell profile
      echo 'eval "$(fnm env --use-on-cd)"' >> ~/.bashrc
      # Source for immediate use
      eval "$(fnm env --use-on-cd)"
    check: which fnm && fnm --version

  debian:
    install: |
      # Install fnm via official installer
      curl -fsSL https://fnm.vercel.app/install | bash
      # Add to shell profile
      echo 'eval "$(fnm env --use-on-cd)"' >> ~/.bashrc
      # Source for immediate use
      eval "$(fnm env --use-on-cd)"
    check: which fnm && fnm --version

  arch:
    install: |
      # Install from AUR or via installer
      if command -v yay &> /dev/null; then
        yay -S fnm-bin
      else
        curl -fsSL https://fnm.vercel.app/install | bash
        echo 'eval "$(fnm env --use-on-cd)"' >> ~/.bashrc
      fi
    check: which fnm && fnm --version

  fedora:
    install: |
      # Install fnm via official installer
      curl -fsSL https://fnm.vercel.app/install | bash
      # Add to shell profile
      echo 'eval "$(fnm env --use-on-cd)"' >> ~/.bashrc
      # Source for immediate use
      eval "$(fnm env --use-on-cd)"
    check: which fnm && fnm --version

  ci:
    install: |
      set -e  # Critical for CI environments to fail fast
      # Install fnm in CI environment
      curl -fsSL https://fnm.vercel.app/install | bash
      # Set up environment
      export PATH="$HOME/.fnm:$PATH"
      eval "$(fnm env --use-on-cd)"
      # Add to GitHub Actions PATH if in GitHub Actions
      if [ -n "$GITHUB_PATH" ]; then
        echo "$HOME/.fnm" >> $GITHUB_PATH
      fi
    check: which fnm && fnm --version

  windows:
    install: |
      # Install fnm for Windows
      winget install Schniz.fnm
      # Or use PowerShell installer
      # iex "& {$(irm https://raw.githubusercontent.com/Schniz/fnm/master/.ci/install.ps1)}"
    check: where.exe fnm && fnm --version

  manual:
    install: |
      # Manual installation from GitHub releases
      FNM_VERSION="1.35.1"
      ARCH=$(uname -m)
      OS=$(uname -s | tr '[:upper:]' '[:lower:]')

      case $ARCH in
        x86_64) FNM_ARCH=x64 ;;
        aarch64) FNM_ARCH=arm64 ;;
        arm64) FNM_ARCH=arm64 ;;
        *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac

      # Download and install
      curl -Lo fnm.tar.gz "https://github.com/Schniz/fnm/releases/download/v${FNM_VERSION}/fnm-${OS}-${FNM_ARCH}.tar.gz"
      tar xzf fnm.tar.gz
      mkdir -p ~/.local/bin
      mv fnm ~/.local/bin/
      rm fnm.tar.gz

      # Add to PATH and shell profile
      export PATH="$HOME/.local/bin:$PATH"
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
      echo 'eval "$(fnm env --use-on-cd)"' >> ~/.bashrc
    check: which fnm && fnm --version
