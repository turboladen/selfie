name: uv
version: 1.0.0
description: Fast Python package and project manager
homepage: https://github.com/astral-sh/uv

environments:
  macos:
    install: |
      set -e

      # Install uv via official installer (recommended method)
      curl -LsSf https://astral.sh/uv/install.sh | sh

      # Source the environment to make uv available immediately
      source ~/.local/bin/env
    check: which uv && uv --version

  ubuntu:
    install: |
      set -e

      # Install uv via official installer
      curl -LsSf https://astral.sh/uv/install.sh | sh

      # Add to PATH for current session
      export PATH="$HOME/.local/bin:$PATH"

      # Add to shell profile for future sessions
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
    check: which uv && uv --version

  debian:
    install: |
      set -e

      # Install uv via official installer
      curl -LsSf https://astral.sh/uv/install.sh | sh

      # Add to PATH for current session
      export PATH="$HOME/.local/bin:$PATH"

      # Add to shell profile for future sessions
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
    check: which uv && uv --version

  arch:
    install: |
      set -e

      # Try pacman first (if available), fallback to installer
      if pacman -Qi uv &>/dev/null || sudo pacman -S uv; then
        echo "Installed uv via pacman"
      else
        echo "Installing uv via official installer"
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
      fi
    check: which uv && uv --version

  fedora:
    install: |
      set -e

      # Install uv via official installer
      curl -LsSf https://astral.sh/uv/install.sh | sh

      # Add to PATH for current session
      export PATH="$HOME/.local/bin:$PATH"

      # Add to shell profile for future sessions
      echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
    check: which uv && uv --version

  ci:
    install: |
      set -e

      # Install uv in CI environment
      curl -LsSf https://astral.sh/uv/install.sh | sh

      # Add to PATH
      export PATH="$HOME/.local/bin:$PATH"

      # Add to GitHub Actions PATH if in GitHub Actions
      if [ -n "$GITHUB_PATH" ]; then
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      fi
    check: which uv && uv --version
