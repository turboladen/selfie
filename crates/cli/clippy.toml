# Crate-scoped: `selfie`'s own tests want a deterministic `/bin/sh`.
#
# `login_shell` is deliberately not listed. Adding it would need an `#[expect]` on
# `create_command_runner`, and a function-wide `#[expect]` also suppresses the two
# below *inside* it — letting the one function that picks the shell silently revert
# to `/bin/sh`. A second `login_shell` call is duplication; a `/bin/sh` call is the
# defect.
#
# The serde-saphyr entries below are copied from the workspace-root `clippy.toml`
# rather than inherited. Clippy reads the nearest `clippy.toml` walking up from the
# crate and stops there, so this file hides the root's lists from `selfie-cli`
# completely -- both the methods and the types. Moving the two above up to the root
# instead is not the fix: banning `ShellCommandRunner::new` workspace-wide fires
# inside the `selfie` crate's own tests, which is what this file exists to avoid.
#
# Keep the two copies in step. A call planted in this crate must make
# `cargo clippy -p selfie-cli --all-targets -- -D warnings` fail.
disallowed-methods = [
  # The isolated git adapter reads none of the user's git configuration, so a
  # real run must never use it. Tests take it from test_common::isolated_git_adapter.
  { path = "selfie::git::GixGitAdapter::isolated", reason = "tests only: a user's run reads their git configuration; use GixGitAdapter::default()" },
  { path = "selfie::git::isolate_git_config", reason = "tests only: a user's git reads their git configuration" },
  { path = "selfie::commands::ShellCommandRunner::new", reason = "use commands::common::create_command_runner — the CLI runs a login shell so provider commands see the user's profile" },
  { path = "selfie::commands::ShellCommandRunner::default_shell", reason = "the CLI runs a login shell so provider commands see the user's profile; use commands::common::create_command_runner" },

  # dialoguer's constructors and reading calls. Every prompt is built by one of
  # DisplayManager's prompt methods, which choose the theme and escape what the
  # prompt shows, and asked through `DisplayManager::prompt`, which owns the
  # terminal while the user answers, so nothing else draws over the question.
  # The one exemption is the prompt module in display_manager.rs.
  { path = "dialoguer::Confirm::new", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Confirm::with_theme", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Select::new", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Select::with_theme", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::FuzzySelect::new", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::FuzzySelect::with_theme", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::MultiSelect::new", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::MultiSelect::with_theme", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Input::new", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Input::with_theme", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Sort::new", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Sort::with_theme", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Password::new", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Password::with_theme", reason = "build prompts with DisplayManager's prompt methods, which choose the theme and escape what the prompt shows" },
  { path = "dialoguer::Editor::edit", reason = "it launches $EDITOR and takes the terminal outside DisplayManager; open files with commands::common::open_editor" },
  { path = "dialoguer::Confirm::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Confirm::interact_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Confirm::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
