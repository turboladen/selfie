# Crate-scoped: `selfie`'s own tests want a deterministic `/bin/sh`.
#
# `login_shell` is deliberately not listed. Adding it would need an `#[expect]` on
# `create_command_runner`, and a function-wide `#[expect]` also suppresses the two
# below *inside* it — letting the one function that picks the shell silently revert
# to `/bin/sh`. A second `login_shell` call is duplication; a `/bin/sh` call is the
# defect.
disallowed-methods = [
  { path = "selfie::commands::ShellCommandRunner::new", reason = "use commands::common::create_command_runner — the CLI runs a login shell so provider commands see the user's profile" },
  { path = "selfie::commands::ShellCommandRunner::default_shell", reason = "the CLI runs a login shell so provider commands see the user's profile; use commands::common::create_command_runner" },
]
