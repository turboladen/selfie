  { path = "serde_saphyr::from_slice_multiple", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_slice_multiple_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_reader", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_reader_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
