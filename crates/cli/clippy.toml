# Crate-scoped: `selfie`'s own tests want a deterministic `/bin/sh`.
#
# `login_shell` is deliberately not listed. Adding it would need an `#[expect]` on
# `create_command_runner`, and a function-wide `#[expect]` also suppresses the two
# below *inside* it — letting the one function that picks the shell silently revert
# to `/bin/sh`. A second `login_shell` call is duplication; a `/bin/sh` call is the
# defect.
#
# The serde-saphyr entries below are copied from the workspace-root `clippy.toml`
# rather than inherited. Clippy reads the nearest `clippy.toml` walking up from the
# crate and stops there, so this file hides the root's lists from `selfie-cli`
# completely -- both the methods and the types. Moving the two above up to the root
# instead is not the fix: banning `ShellCommandRunner::new` workspace-wide fires
# inside the `selfie` crate's own tests, which is what this file exists to avoid.
#
# Keep the two copies in step. A call planted in this crate must make
# `cargo clippy -p selfie-cli --all-targets -- -D warnings` fail.
disallowed-methods = [
  { path = "selfie::commands::ShellCommandRunner::new", reason = "use commands::common::create_command_runner — the CLI runs a login shell so provider commands see the user's profile" },
  { path = "selfie::commands::ShellCommandRunner::default_shell", reason = "the CLI runs a login shell so provider commands see the user's profile; use commands::common::create_command_runner" },

  # dialoguer's reading calls. Every prompt is asked through
  # `DisplayManager::prompt`, which owns the terminal while the user answers, so
  # nothing else draws over the question. Its one exemption is in display_manager.rs.
  { path = "dialoguer::Confirm::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Confirm::interact_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Confirm::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Confirm::interact_on_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Select::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Select::interact_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Select::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Select::interact_on_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::MultiSelect::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::MultiSelect::interact_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::MultiSelect::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::MultiSelect::interact_on_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::FuzzySelect::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::FuzzySelect::interact_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::FuzzySelect::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::FuzzySelect::interact_on_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Input::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Input::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Input::interact_text", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Input::interact_text_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Sort::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Sort::interact_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Sort::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Sort::interact_on_opt", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Password::interact", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },
  { path = "dialoguer::Password::interact_on", reason = "ask through DisplayManager::prompt, which keeps the terminal to the prompt while the user answers" },

  { path = "serde_saphyr::from_str", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_str_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_slice", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_slice_with_options", reason = "use selfie::yaml::parse, which does not quote the file" },
  { path = "serde_saphyr::from_multiple", reason = "use selfie::yaml::parse, which does not quote the file" },
