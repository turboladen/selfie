disallowed-types = [
  { path = "serde_saphyr::Error", reason = "let selfie::yaml::ParseFailure carry a parse failure; the raw error renders the file's text" },
  { path = "serde_saphyr::Deserializer", reason = "let selfie::yaml::parse drive the deserializer; a hand-driven one keeps the raw error" },
  { path = "serde_saphyr::Serializer", reason = "let selfie::yaml::serialize drive the serializer; a hand-driven one keeps the raw error" },
  { path = "serde_saphyr::SerializeError", reason = "let selfie::yaml::SerializeFailure carry a write failure; the raw error can quote the value" },
]
