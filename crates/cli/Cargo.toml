[package]
name = "selfie-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "selfie"
path = "src/main.rs"
# The library crate is also named selfie, and both would document into target/doc/selfie.
doc = false

[dependencies]
anyhow.workspace = true
clap = { version = "4.5.31", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
etcetera.workspace = true
shellexpand.workspace = true
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
console.workspace = true
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
indicatif.workspace = true
futures.workspace = true
# "pthread" and "signal" are for ending a terminal prompt when a signal cancels
# the run.
nix = { workspace = true, features = ["pthread", "signal"] }
human-panic = "2"
# The general category and Default_Ignorable_Code_Point of a character, for
# escaping what reaches the terminal.
icu_properties = "2.2"
selfie = { path = "../selfie/" }
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
uuid.workspace = true
mockall.workspace = true
# "fs" is for `mkfifo`. The snippet reader opens a file the repository already
# read, and a fifo at that path blocks on open — the guard against that is only
# watchable with a real one, since a mock cannot block. Same reason as the
# entry in `crates/selfie/Cargo.toml`. "term" and "signal" are for the prompt
# tests, which drive the binary on a pseudoterminal and signal it.
nix = { workspace = true, features = ["fs", "signal", "term"] }
predicates = "3.1"
selfie = { path = "../selfie/", features = ["with_mocks"] }
tempfile.workspace = true
test-common = { path = "../test-common/" }
tokio-test = "0.4"
