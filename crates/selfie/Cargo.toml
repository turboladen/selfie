[package]
name = "selfie"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono.workspace = true
config = { version = "0.15.9", features = ["yaml"] }
dunce.workspace = true
etcetera = "0.11"
futures.workspace = true
gix.workspace = true
mockall = { workspace = true, optional = true }
pretty_assertions = "1.4.1"
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
shellexpand = "3.1"
similar.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror = "2.0"
tokio-util.workspace = true
tokio = { workspace = true, features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }
tracing.workspace = true
url = { version = "2.5.4", features = ["serde"] }
uuid.workspace = true
which = "8.0"

[dev-dependencies]
mockall.workspace = true
test-common = { path = "../test-common/" }
tracing-subscriber.workspace = true
tokio = { version = "1.44", features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# "user" is for `Uid::effective`, which `privilege::RealPrivilege` needs. `std`
# has no `geteuid`, and `libc`'s is `unsafe` -- this keeps the crate free of
# `unsafe` for the same reason the dev entry below did.
nix = { version = "0.31", features = ["user"] }

[target.'cfg(unix)'.dev-dependencies]
# "fs" is for `mkfifo`, which the irregular-target tests need to build a target
# that blocks on open. There is no std equivalent; the alternatives were a
# subprocess or the crate's first `unsafe` block. "user" comes from the
# production entry above, which cargo unifies into the test build.
nix = { version = "0.31", features = ["fs"] }

[features]
default = []
with_mocks = ["mockall"]
