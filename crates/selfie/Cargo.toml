[package]
name = "selfie"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono.workspace = true
dunce.workspace = true
etcetera.workspace = true
futures.workspace = true
gix.workspace = true
indexmap.workspace = true
mockall = { workspace = true, optional = true }
# "user" is for `Uid::effective`, which `privilege::RealPrivilege` needs. `std`
# has no `geteuid`, and `libc`'s is `unsafe` -- this keeps the crate free of
# `unsafe` for the same reason the dev entry below did. "fs" is for the `OFlag`
# constants `RealFileSystem::read_file_no_follow` opens with, which `std` does not
# name. "term" turns off echo on a command's terminal, and "signal" is `killpg`,
# which ends every process a command started on it.
nix = { workspace = true, features = ["fs", "signal", "term", "user"] }
# `renameat_with(RenameFlags::EXCHANGE)` is the swap that lets a write replace only
# an unchanged file: `renameat2` on Linux and `renameatx_np` on Apple, which nix
# offers only on Linux.
rustix = { workspace = true, features = ["fs"] }
# Gives a command a pseudo-terminal as its controlling terminal, so a prompt it
# writes to `/dev/tty` reaches selfie instead of the user's screen. The crate holds
# the `unsafe` that `setsid` and `TIOCSCTTY` need, which keeps this one free of it.
pty-process = { version = "0.5.4", features = ["async"] }
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
shellexpand.workspace = true
shlex = "2.0"
similar.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror = "2.0"
tokio-util.workspace = true
tokio = { workspace = true, features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "sync",
  "time",
] }
tracing.workspace = true
url = { version = "2.5.4", features = ["serde"] }
uuid.workspace = true
which = "8.0"
zeroize = "1"

[dev-dependencies]
mockall.workspace = true
# "fs" is for `mkfifo`, which the irregular-target tests need to build a target
# that blocks on open, and for `OFlag::O_NONBLOCK`, which one of them opens a
# fifo for reading with. There is no std equivalent for either; the alternatives
# were a subprocess or the crate's first `unsafe` block. "user" comes from the
# production entry above, which cargo unifies into the test build.
nix = { workspace = true, features = ["fs"] }
test-common = { path = "../test-common/" }
tracing-subscriber.workspace = true
tokio = { version = "1.44", features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "test-util",
  "time",
] }

[features]
default = []
with_mocks = ["mockall"]
