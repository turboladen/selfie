[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
# Declared here rather than in the workspace table: the CLI is the only other
# crate using it, and it pins the same version.
clap = { version = "4.5.31", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
nix = { version = "0.31", features = ["signal"] }
regex = "1"
tempfile.workspace = true
