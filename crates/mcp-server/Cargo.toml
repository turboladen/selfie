[package]
name = "selfie-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "selfie-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
libc = "0.2"
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2"
selfie = { path = "../selfie" }
selfie-escape = { path = "../escape" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
nix = { workspace = true, features = ["signal"] }
rmcp = { version = "3.1", features = ["client"] }
# The tests use selfie's mocks and test-only constructors, which only this
# feature compiles. Dev-dependency features stay out of `cargo build`.
selfie = { path = "../selfie", features = ["with_mocks"] }
strum.workspace = true
test-common = { path = "../test-common/" }
tempfile.workspace = true
uuid.workspace = true
